<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{ album.title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>{{ album.title }}</h1>
      <div>
        <form id="uploadForm" enctype="multipart/form-data">
          <input type="file" name="photos" multiple />
          <button type="submit">Upload</button>
        </form>
      </div>
      <div id="grid" class="grid"></div>
    </div>
    <script>
      const slug = '{{ album.slug }}'
      async function loadPhotos(){
        const res = await fetch(`/api/album/${slug}/photos`)
        const photos = await res.json()
        const g = document.getElementById('grid')
        g.innerHTML = ''
        photos.forEach(p => {
          const el = document.createElement('div')
          el.className = 'tile'
          el.innerHTML = `<img src="${p.src}" /><div class="meta"><button data-id="${p.id}" class="like">❤ ${p.likes}</button></div>`
          g.appendChild(el)
        })
        document.querySelectorAll('.like').forEach(b=>b.addEventListener('click', async (e)=>{
          const id = e.target.dataset.id
          const r = await fetch(`/photo/${id}/like`, {method:'POST'})
          const j = await r.json()
          if (j.likes!==undefined) e.target.innerText = `❤ ${j.likes}`
        }))
      }
      document.getElementById('uploadForm').addEventListener('submit', async (e)=>{
        e.preventDefault()
        const f = e.target.querySelector('input[type=file]')
        const fd = new FormData()
        for (let i=0;i<f.files.length;i++) fd.append('photos', f.files[i])
        const res = await fetch(`/upload/${slug}`, {method:'POST', body:fd})
        await res.json()
        loadPhotos()
      })
      loadPhotos()
    </script>
  </body>
</html>
